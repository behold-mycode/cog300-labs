<polyline points="720,535 850,535" fill="none" stroke="#15803d" stroke-width="4" stroke-linejoin="round"/>
<circle cx="875" cy="535" r="25" fill="#15803d" stroke="#172b40" stroke-width="2"/>
<text x="813" y="579" class="small">A (+)</text>
<text x="904" y="579" class="small">K (−)</text>
<polyline points="900,535 1250,535 1250,815" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
<text x="950" y="518" class="head">GREEN LED</text>
<text x="950" y="566" class="small">Long leg = anode (A)</text>
<text x="325" y="662" class="label">D12</text>
<polyline points="420,655 620,655" fill="none" stroke="#b91c1c" stroke-width="4" stroke-linejoin="round"/>
<rect x="620" y="639" width="100" height="32" fill="white" stroke="#b91c1c" stroke-width="3"/>
<text x="640" y="628" class="small">1 kΩ</text>
<polyline points="720,655 850,655" fill="none" stroke="#b91c1c" stroke-width="4" stroke-linejoin="round"/>
<circle cx="875" cy="655" r="25" fill="#b91c1c" stroke="#172b40" stroke-width="2"/>
<text x="813" y="699" class="small">A (+)</text>
<text x="904" y="699" class="small">K (−)</text>
<polyline points="900,655 1250,655 1250,815" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
<text x="950" y="638" class="head">RED LED</text>
<text x="950" y="686" class="small">Long leg = anode (A)</text>
<polyline points="420,425 460,425 460,815 1290,815" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
<text x="820" y="802" class="small">GND return rail (all grounds joined)</text>
<text x="90" y="715" class="small">D5–D10: motor signals below</text>
<text x="65" y="864" class="small">Use one resistor per LED. Never connect an LED directly between a GPIO and GND.</text>
<rect x="65" y="905" width="535" height="265" rx="14" fill="#ffffff" stroke="#9aabbc" stroke-width="2"/>
<text x="90" y="945" class="head">Existing motor wiring — unchanged</text>
<text x="90" y="989" class="label">D9 → ENA       D8 → IN1       D7 → IN2</text>
<text x="90" y="1029" class="label">D10 → ENB     D6 → IN3       D5 → IN4</text>
<text x="90" y="1075" class="small">Uno GND → L298N GND</text>
<text x="90" y="1110" class="small">Remove ENA / ENB jumper caps for PWM.</text>
<text x="90" y="1142" class="small">Keep the existing verified motor power circuit.</text>
<rect x="635" y="905" width="680" height="265" rx="14" fill="#ffffff" stroke="#9aabbc" stroke-width="2"/>
<text x="660" y="945" class="head">L298N → wheels / power reference</text>
<text x="660" y="989" class="label">OUT1 + OUT2 → left motor; OUT3 + OUT4 → right</text>
<text x="660" y="1033" class="small">Sensor uses Uno 5V, never motor supply / battery +.</text>
<text x="660" y="1071" class="small">USB bench setup only: Uno 5V → VS and logic 5V;</text>
<text x="660" y="1100" class="small">5V-EN regulator jumper removed; battery disconnected.</text>
<text x="660" y="1142" class="small">Check your module against the linked power guide first.</text>
<path d="M 446 535 H 474" stroke="#f8fafc" stroke-width="12"/>
<polyline points="446,535 474,535" fill="none" stroke="#15803d" stroke-width="4" stroke-linejoin="round"/>
<path d="M 446 655 H 474" stroke="#f8fafc" stroke-width="12"/>
<polyline points="446,655 474,655" fill="none" stroke="#b91c1c" stroke-width="4" stroke-linejoin="round"/>
<circle cx="460" cy="425" r="6" fill="#334155"/>
<circle cx="1250" cy="655" r="6" fill="#334155"/>
<circle cx="1250" cy="815" r="6" fill="#334155"/>
<text x="65" y="1220" class="small">Dots mark connections. Wire crossings without dots are not joined.</text>
<text x="65" y="1270" class="head">GREEN: valid clear path. RED: front blocked or sensor unavailable.</text>
<text x="65" y="1310" class="small">On detection both motors stop; a fresh reverse command is allowed while red remains on.</text>
<text x="65" y="1345" class="small">Stop ≤ 25 cm • clear &gt; 35 cm for three readings • measure coasting distance before floor use.</text>
</svg>