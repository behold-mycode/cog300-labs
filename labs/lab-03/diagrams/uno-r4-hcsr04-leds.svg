<text x="890" y="282" class="label">VCC</text>
<text x="330" y="332" class="label">D4</text>
<polyline points="420,325 865,325" fill="none" stroke="#b77900" stroke-width="4" stroke-linejoin="round"/>
<text x="890" y="332" class="label">TRIG</text>
<text x="330" y="382" class="label">D2</text>
<polyline points="420,375 865,375" fill="none" stroke="#6d28d9" stroke-width="4" stroke-linejoin="round"/>
<text x="890" y="382" class="label">ECHO</text>
<text x="330" y="432" class="label">GND</text>
<polyline points="420,425 865,425" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
<text x="890" y="432" class="label">GND</text>
<text x="500" y="265" class="small">5 V supply</text>
<text x="500" y="315" class="small">Trigger → sensor</text>
<text x="500" y="365" class="small">Echo → interrupt input</text>
<text x="500" y="415" class="small">Common ground</text>
<text x="90" y="490" class="small">NEW indicator outputs</text>
<text x="325" y="542" class="label">D11</text>
<polyline points="420,535 620,535" fill="none" stroke="#15803d" stroke-width="4" stroke-linejoin="round"/>
<rect x="620" y="519" width="100" height="32" fill="white" stroke="#15803d" stroke-width="3"/>
