<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400"><rect width="1400" height="1400" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#172b40} .small{font-size:18px} .label{font-size:22px} .title{font-size:32px;font-weight:bold} .head{font-size:24px;font-weight:bold}</style>
<text x="60" y="60" class="title">Lab 3 • Front distance sensor + status LEDs</text>
<text x="60" y="98" class="label">Arduino Uno R4 WiFi / L298N • Proposed wiring — match terminal labels, not physical positions</text>
<rect x="65" y="155" width="355" height="605" rx="14" fill="#e7f3f4" stroke="#9aabbc" stroke-width="2"/>
<text x="90" y="200" class="head">UNO R4 WiFi</text>
<text x="90" y="230" class="small">5 V GPIO • existing USB link</text>
<rect x="865" y="155" width="450" height="305" rx="14" fill="#ffffff" stroke="#9aabbc" stroke-width="2"/>
<text x="890" y="200" class="head">HC-SR04 (standard 5 V)</text>
<text x="890" y="230" class="small">Mount at front, facing ahead</text>
<text x="330" y="282" class="label">5V</text>
