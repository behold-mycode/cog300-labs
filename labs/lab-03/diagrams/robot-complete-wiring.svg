<circle cx="1830" cy="1655" r="6" fill="#344554"/>
<text x="1810" y="1640" class="small">Green LED cathode</text>
<text x="55" y="1740" class="body">* Right VCC: leave disconnected until dual-sensor firmware is installed. Current V2 measures front only.</text>
<text x="55" y="1780" class="body">** VS is currently fed from Uno 5V in the course bench setup. Remove that wire BEFORE connecting a rated motor battery.</text>
<text x="55" y="1820" class="body">Future AA battery: specs pending. Do not connect it yet. Sensors and driver logic must remain on regulated 5 V.</text>
<text x="55" y="1860" class="small">Rail labels denote the same electrical node. Motor pairs go across OUT terminals, never to GND. Power off before rewiring.</text>
