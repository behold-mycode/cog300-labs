<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2200" viewBox="0 0 2200 2200"><rect width="2200" height="2200" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#183044}.title{font-size:38px;font-weight:bold}.head{font-size:27px;font-weight:bold}.body{font-size:23px}.small{font-size:20px}</style>
<text x="55" y="60" class="title">COG300 • Complete robot wiring</text>
<text x="55" y="102" class="body">UNO R4 WiFi • L298N • two HC-SR04 sensors • two motors • green status LED</text>
<text x="55" y="138" class="small">Solid connections: current USB bench arrangement. Battery is NOT connected. Match terminal labels, not drawn board positions.</text>
