<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COGS 300 · Robot</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main>
<header><h1>Robot controller</h1><span id="badge">Disconnected</span></header>
<div class="connection"><label for="port">Robot</label><select id="port" aria-label="Robot serial port"></select><button id="refresh">Refresh</button><button id="connect">Connect</button></div>
<p id="status" role="status">Connect to control the robot.</p><p id="error" role="alert" hidden></p>
<section id="drive" tabindex="0" aria-label="Robot controls">
<label for="mode">Mode</label><select id="mode">
<option value="RACE">Maze solver</option><option value="MANUAL">Manual driving</option>
</select>
<div class="run-controls"><button id="start" class="primary" disabled>Start</button><button id="stop">Stop <span>SPACE / ESC</span></button></div>
<p id="robotState" role="status">Stopped</p>
<div class="keys" aria-hidden="true"><kbd id="keyUp">↑</kbd><div><kbd id="keyLeft">←</kbd><kbd id="keyDown">↓</kbd><kbd id="keyRight">→</kbd></div></div>
<p class="instruction">Hold arrows or WASD for manual driving. Release to stop.</p>
<p class="hint">Changing mode stops the robot. Press Start to run it.<br>USB control stops if this window loses focus or disconnects.</p>
</section><footer>COGS 300 <span id="demo"></span></footer>
</main></body></html>
